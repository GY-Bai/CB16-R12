name: CB16 Dispatch — Builder (ds:run)

# Command surface: adding the trusted `ds:run` label to an Issue is the trigger.
# Removing a label is not a command.  This workflow never executes fork or
# pull-request code; it only ever runs from the trusted default branch.
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

# Same Issue (and therefore the same task branch) cannot run twice at once.
concurrency:
  group: cb16-dispatch-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  builder:
    if: >-
      github.event.label.name == 'ds:run' &&
      github.repository == 'GY-Bai/CB16-R12'
    runs-on: [self-hosted, Linux, ARM64, oci-cpu, r12]
    timeout-minutes: 60
    steps:
      - name: Validate trusted trigger
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TRIGGER_LABEL: ${{ github.event.label.name }}
          ACTOR: ${{ github.event.sender.login }}
        run: |
          set -euo pipefail
          echo "repository=${{ github.repository }} issue=#${ISSUE_NUMBER} label=${TRIGGER_LABEL} actor=${ACTOR}"

      - name: Checkout trusted default branch without persisted credentials
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure git identity for dispatcher-owned commits
        run: |
          set -euo pipefail
          git config --local user.name "Gengyuan Bai"
          git config --local user.email "37661207+GY-Bai@users.noreply.github.com"

      - name: Run deterministic dispatcher (Builder lane)
        env:
          # The dispatcher holds this token only for post-DSH publish steps.
          # The DSH child environment is scrubbed before the agent starts.
          CB16_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CB16_TRUSTED_ACTORS: ${{ github.repository_owner }}
          CB16_WORK_ROOT: ${{ vars.CB16_WORK_ROOT }}
          CB16_STATE_DIR: ${{ vars.CB16_STATE_DIR }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          python3 scripts/cb16_dispatch.py \
            --lane builder \
            --event "$GITHUB_EVENT_PATH" \
            --repo-dir "$GITHUB_WORKSPACE" \
            --repo-url "https://github.com/${GITHUB_REPOSITORY}.git" \
            --report-dir "$GITHUB_WORKSPACE/.cb16/report" \
            --publish

      - name: Upload bounded dispatch evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cb16-builder-evidence-${{ github.event.issue.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/.cb16/report/
          if-no-files-found: warn
          retention-days: 14
