[project]
name = "cb16-science"
version = "0.0.0"
description = "CB16 R12 science package: VS-A contracts/physics and the VS-B learner spine."
requires-python = ">=3.9"
dependencies = [
    "numpy>=2.0",
    "torch>=2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["science/cb16_science"]

# CPU-only PyTorch. The default aarch64 Linux wheel now resolves to a CUDA
# runtime this CPU slice neither needs nor qualifies against.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
